services:
  user-api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["npm", "run", "start:user-api"]
    ports:
      - "3101:3101"
    env_file:
      - deploy/.env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  auth-api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["npm", "run", "start:auth-api"]
    ports:
      - "3102:3102"
    env_file:
      - deploy/.env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  owner-api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["npm", "run", "start:owner-api"]
    ports:
      - "3105:3105"
    env_file:
      - deploy/.env
    restart: unless-stopped

  # WebSocket чат (путь /ws). За nginx: proxy_pass на этот порт + заголовки Upgrade (см. deploy/nginx-ws.example.conf)
  ws-server:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["npm", "run", "start:ws-server"]
    ports:
      - "3103:3103"
    env_file:
      - deploy/.env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
